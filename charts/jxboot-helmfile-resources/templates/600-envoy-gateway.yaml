{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
{{- if .Values.jxRequirements.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ if .Values.jxRequirements.ingress.tls.production }}letsencrypt-production{{ else }}letsencrypt-staging{{ end }}
{{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName | default .Values.gatewayClass.name }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*{{ .Values.jxRequirements.ingress.namespaceSubDomain }}{{ .Values.jxRequirements.ingress.domain }}"
      allowedRoutes:
        namespaces:
          from: Same
{{- if .Values.jxRequirements.ingress.tls.enabled }}
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*{{ .Values.jxRequirements.ingress.namespaceSubDomain }}{{ .Values.jxRequirements.ingress.domain }}"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ if .Values.jxRequirements.ingress.tls.secretName }}"{{ .Values.jxRequirements.ingress.tls.secretName }}"{{ else if .Values.jxRequirements.ingress.tls.production }}"tls-{{ .Values.jxRequirements.ingress.domain | replace "." "-" }}-p"{{ else }}"tls-{{ .Values.jxRequirements.ingress.domain | replace "." "-" }}-s"{{ end }}
            namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
