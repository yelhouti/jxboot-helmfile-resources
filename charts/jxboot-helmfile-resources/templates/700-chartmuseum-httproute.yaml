{{- if and (not (or (eq "bucketrepo" .Values.jxRequirements.repository) (not .Values.jxRequirements.repository) (eq "none" .Values.jxRequirements.repository))) .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chartmuseum
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Release.Namespace }}
      sectionName: {{ if .Values.jxRequirements.ingress.tls.enabled }}https{{ else }}http{{ end }}
  hostnames:
{{- if .Values.chartmuseum.ingress.customHost }}
    - {{ .Values.chartmuseum.ingress.customHost }}
{{- else if .Values.ingress.customHosts.chartmuseum }}
    - {{ .Values.ingress.customHosts.chartmuseum }}
{{- else if .Values.jxRequirements.ingress.domain }}
    - {{ .Values.ingress.prefix.chartmuseum | default .Values.chartmuseum.ingress.prefix }}{{ .Values.jxRequirements.ingress.namespaceSubDomain }}{{ .Values.jxRequirements.ingress.domain }}
{{- end }}
  rules:
    - backendRefs:
        - name: jenkins-x-chartmuseum
          port: 8080
{{- if .Values.jxRequirements.ingress.tls.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chartmuseum-redirect
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Release.Namespace }}
      sectionName: http
  hostnames:
{{- if .Values.chartmuseum.ingress.customHost }}
    - {{ .Values.chartmuseum.ingress.customHost }}
{{- else if .Values.ingress.customHosts.chartmuseum }}
    - {{ .Values.ingress.customHosts.chartmuseum }}
{{- else if .Values.jxRequirements.ingress.domain }}
    - {{ .Values.ingress.prefix.chartmuseum | default .Values.chartmuseum.ingress.prefix }}{{ .Values.jxRequirements.ingress.namespaceSubDomain }}{{ .Values.jxRequirements.ingress.domain }}
{{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
