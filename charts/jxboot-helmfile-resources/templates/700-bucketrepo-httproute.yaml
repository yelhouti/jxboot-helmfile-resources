{{- if and (eq "bucketrepo" .Values.jxRequirements.repository) .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bucketrepo
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Release.Namespace }}
      sectionName: {{ if .Values.jxRequirements.ingress.tls.enabled }}https{{ else }}http{{ end }}
  hostnames:
{{- if .Values.bucketrepo.ingress.customHost }}
    - {{ .Values.bucketrepo.ingress.customHost }}
{{- else if .Values.ingress.customHosts.bucketrepo }}
    - {{ .Values.ingress.customHosts.bucketrepo }}
{{- else if .Values.jxRequirements.ingress.domain }}
    - {{ .Values.ingress.prefix.bucketrepo | default .Values.bucketrepo.ingress.prefix }}{{ .Values.jxRequirements.ingress.namespaceSubDomain }}{{ .Values.jxRequirements.ingress.domain }}
{{- end }}
  rules:
    - backendRefs:
        - name: bucketrepo
          port: 80
{{- if .Values.jxRequirements.ingress.tls.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bucketrepo-redirect
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Release.Namespace }}
      sectionName: http
  hostnames:
{{- if .Values.bucketrepo.ingress.customHost }}
    - {{ .Values.bucketrepo.ingress.customHost }}
{{- else if .Values.ingress.customHosts.bucketrepo }}
    - {{ .Values.ingress.customHosts.bucketrepo }}
{{- else if .Values.jxRequirements.ingress.domain }}
    - {{ .Values.ingress.prefix.bucketrepo | default .Values.bucketrepo.ingress.prefix }}{{ .Values.jxRequirements.ingress.namespaceSubDomain }}{{ .Values.jxRequirements.ingress.domain }}
{{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
